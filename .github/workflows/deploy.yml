name: Deploy Logseq Web to GitHub Pages

on:
  push:
    branches:
      - main # Déclenche le build à chaque push sur la branche principale

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone and Pin Logseq Official Repo
        run: |
          git clone https://github.com/logseq/logseq.git logseq-src
          cd logseq-src
          git checkout 0.10.9

      # Installation des dépendances natives requises pour compiler les modules comme Canvas/Pixman
      - name: Install Native Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            libpixman-1-dev

      - name: Setup Node.js (Node 20)
        uses: actions/setup-node@v4
        with:
          node-version: 20 # La version 0.10.9 est optimisée pour Node 20

      - name: Enable Corepack
        run: corepack enable

      - name: Build Logseq Web
        working-directory: logseq-src
        env:
          COREPACK_ENABLE_PROJECT_SPEC: 0
        run: |
          yarn install --frozen-lockfile
          yarn build:web
          mv static ../public

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
